name: v8 Windows tick + AOI server

# 학습 프로젝트라 push/PR마다 자동으로 돌리지 않고, 필요할 때 GitHub Actions 화면에서 직접 실행한다.
# v8 테스트(단위·통합)와 부하 봇은 저장소에서 지웠으므로 Release·ASan 빌드가 되는지만 확인한다.
on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            build_dir: build/server
            config: Release
            cmake_args: ""
          - name: AddressSanitizer
            build_dir: build/server-asan
            config: RelWithDebInfo
            cmake_args: "-DV8_ENABLE_ASAN=ON"

    env:
      V8_BUILD_DIR: ${{ matrix.build_dir }}
      V8_CONFIG: ${{ matrix.config }}
      V8_CMAKE_ARGS: ${{ matrix.cmake_args }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake -S server -B $env:V8_BUILD_DIR -A x64 $env:V8_CMAKE_ARGS

      - name: Build v8
        shell: pwsh
        run: cmake --build $env:V8_BUILD_DIR --config $env:V8_CONFIG --target v8_server --parallel
