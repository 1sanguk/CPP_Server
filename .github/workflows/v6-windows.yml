name: v6 Windows IOCP

on:
  push:
    paths:
      - "server/CMakeLists.txt"
      - "server/v6/**"
      - ".github/workflows/v6-windows.yml"
  pull_request:
    paths:
      - "server/CMakeLists.txt"
      - "server/v6/**"
      - ".github/workflows/v6-windows.yml"
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    name: ${{ matrix.name }}
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Normal
            build_dir: server/build
            config: Debug
            cmake_args: ""
            expect_partial: "false"
          - name: Forced partial send
            build_dir: server/build-partial
            config: Debug
            cmake_args: "-DV6_FORCE_PARTIAL_SEND_TEST=ON"
            expect_partial: "true"
          - name: AddressSanitizer
            build_dir: server/build-asan
            config: RelWithDebInfo
            cmake_args: "-DV6_ENABLE_ASAN=ON"
            expect_partial: "false"

    env:
      V6_BUILD_DIR: ${{ matrix.build_dir }}
      V6_CONFIG: ${{ matrix.config }}
      V6_CMAKE_ARGS: ${{ matrix.cmake_args }}
      V6_EXPECT_PARTIAL: ${{ matrix.expect_partial }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure v6
        shell: pwsh
        run: cmake -S server -B $env:V6_BUILD_DIR -A x64 $env:V6_CMAKE_ARGS

      - name: Build v6
        shell: pwsh
        run: cmake --build $env:V6_BUILD_DIR --config $env:V6_CONFIG --parallel

      - name: Run echo and pending-send shutdown tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $serverPath = (Resolve-Path "$env:V6_BUILD_DIR/v6/$env:V6_CONFIG/v6_server.exe").Path

          function Start-V6Server {
              $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
              $startInfo.FileName = $serverPath
              $startInfo.UseShellExecute = $false
              $startInfo.RedirectStandardInput = $true
              $startInfo.RedirectStandardOutput = $true
              $startInfo.RedirectStandardError = $true

              $process = [System.Diagnostics.Process]::new()
              $process.StartInfo = $startInfo
              if (-not $process.Start()) {
                  throw "Failed to start v6_server.exe"
              }
              return $process
          }

          function Connect-V6Client {
              for ($attempt = 0; $attempt -lt 50; ++$attempt) {
                  $client = [System.Net.Sockets.TcpClient]::new()
                  try {
                      $client.Connect("127.0.0.1", 9000)
                      return $client
                  }
                  catch {
                      $client.Dispose()
                      Start-Sleep -Milliseconds 100
                  }
              }
              throw "v6_server did not listen on port 9000"
          }

          function Stop-V6Server($process) {
              $exitedBeforeStop = $process.HasExited
              $stdinError = ""
              if (-not $exitedBeforeStop) {
                  try {
                      $process.StandardInput.WriteLine()
                      $process.StandardInput.Flush()
                  }
                  catch {
                      $stdinError = $_.Exception.Message
                      $process.WaitForExit(1000) | Out-Null
                      $exitedBeforeStop = $process.HasExited
                      if (-not $exitedBeforeStop) {
                          throw
                      }
                  }
              }

              if (-not $process.WaitForExit(30000)) {
                  $process.Kill($true)
                  $process.WaitForExit()
                  throw "v6_server did not stop within 30 seconds"
              }

              $stdout = $process.StandardOutput.ReadToEnd()
              $stderr = $process.StandardError.ReadToEnd()
              Write-Host $stdout
              if ($stderr) {
                  Write-Host $stderr
              }
              if ($stderr -match "ERROR: AddressSanitizer") {
                  throw "AddressSanitizer reported an error"
              }
              if ($process.ExitCode -ne 0) {
                  throw "v6_server exited with code $($process.ExitCode)"
              }
              if ($exitedBeforeStop) {
                  throw "v6_server exited before the stop request. stdin error: $stdinError"
              }
              return $stdout
          }

          $echoServer = Start-V6Server
          $echoOutput = ""
          try {
              $client = Connect-V6Client
              try {
                  $stream = $client.GetStream()
                  $stream.ReadTimeout = 10000
                  $payload = [byte[]]::new(262144)
                  for ($i = 0; $i -lt $payload.Length; ++$i) {
                      $payload[$i] = $i % 251
                  }

                  $stream.Write($payload, 0, $payload.Length)
                  $received = [byte[]]::new($payload.Length)
                  $offset = 0
                  while ($offset -lt $received.Length) {
                      $count = $stream.Read($received, $offset, $received.Length - $offset)
                      if ($count -eq 0) {
                          throw "Server closed during echo response"
                      }
                      $offset += $count
                  }

                  $sentBase64 = [System.Convert]::ToBase64String($payload)
                  $receivedBase64 = [System.Convert]::ToBase64String($received)
                  if ($sentBase64 -cne $receivedBase64) {
                      throw "Echo payload mismatch"
                  }
              }
              finally {
                  $client.Dispose()
              }
          }
          finally {
              $echoOutput = Stop-V6Server $echoServer
              $echoServer.Dispose()
          }

          if ($env:V6_EXPECT_PARTIAL -eq "true" -and
              $echoOutput -notmatch "partial sends=([1-9][0-9]*)") {
              throw "Forced partial-send build did not report a partial send"
          }

          $shutdownServer = Start-V6Server
          $shutdownOutput = ""
          try {
              $slowClient = Connect-V6Client
              try {
                  $stream = $slowClient.GetStream()
                  $largePayload = [byte[]]::new(4194304)
                  for ($i = 0; $i -lt $largePayload.Length; ++$i) {
                      $largePayload[$i] = $i % 239
                  }

                  $writeTask = $stream.WriteAsync($largePayload, 0, $largePayload.Length)
                  if (-not $writeTask.Wait(10000)) {
                      throw "Client could not submit the large payload within 10 seconds"
                  }
                  Start-Sleep -Milliseconds 200
                  $shutdownOutput = Stop-V6Server $shutdownServer
              }
              finally {
                  $slowClient.Dispose()
              }
          }
          finally {
              if (-not $shutdownServer.HasExited) {
                  $shutdownServer.Kill($true)
              }
              $shutdownServer.Dispose()
          }
